[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fass"
version = "0.1.0"
description = "AI FFmpeg command assistant: natural-language editing requests become validated ffmpeg commands (plan0.md milestone 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Remote volume mapping (Config -> Volumes -> *_remote): FTP is stdlib
# ftplib; SFTP needs paramiko, S3 needs boto3.
storage = ["boto3>=1.34", "paramiko>=3.4"]
dev = ["pytest>=8"]

[project.scripts]
fass = "fass.cli:main"

[tool.setuptools.packages.find]
include = ["fass*"]

[tool.setuptools.package-data]
fass = ["registry/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
