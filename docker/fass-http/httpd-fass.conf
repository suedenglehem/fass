# fass-http sidecar response headers (web-UI Player tab).
#
# The Player tab's page is served by fass on :8000 and XHR-fetches the
# HLS/DASH playlists from this sidecar on FASS_HTTP_PORT (default :8080) —
# a different origin, so the web player (shaka-player) needs CORS on the
# playlists, and it fetches its segments cross-origin too. Live playlists
# grow in place, so they must be revalidated: browsers cache them
# aggressively and would otherwise serve a stale copy of a growing
# playlist.
#
# The stock httpd.conf in httpd:2.4-alpine has NO glob include under
# conf/extra/ — every httpd-*.conf Include there is commented out (only
# proxy-html.conf is live), so compose pulls this file in explicitly:
#   command: ["-DFOREGROUND", "-c", "Include conf/extra/httpd-fass.conf"]
# mod_headers is loaded by default in the image, so no LoadModule here.

# CORS on the playlists and on the segments the players fetch beside them
# (hls: .m3u8 + .ts / .m4s; dash: .mpd + .m4s — init chunks are .m4s too).
<FilesMatch "\.(m3u8|mpd|ts|m4s)$">
    Header always set Access-Control-Allow-Origin "*"
</FilesMatch>

# Force revalidation of the live playlists.
<FilesMatch "\.(m3u8|mpd)$">
    Header always set Cache-Control "no-cache"
</FilesMatch>
