# fass deployment (M6). From the repo root:
#
#   docker compose -f docker/compose.yaml up -d --build
#
# The web UI's Apply button recreates the fass container via the
# fass-worker sidecar (same image, different command). For it to work:
#   - the docker socket must be mounted on BOTH services (uncommented
#     below), with FASS_DOCKER_MANAGE=1
#   - FASS_DOCKER_WORKER points fass at the sidecar (compose service DNS)
# The sidecar stops fass, creates+starts the replacement, and records the
# outcome in /config/last-apply.json (shared volume), which the UI reads.
# Stream port mappings below must mirror the Config tab's port list.
#
# RAG IS PART OF THE DEFAULT DEPLOYMENT (M13): fass-rag comes up with this
# file (no profile, no overlay — docker/compose.rag.yaml is retired), and the
# fass service is configured to use it via FASS_RAG_ENABLED=1 +
# FASS_RAG_URL. The corpus index is baked into the fass-rag image
# (docker/Dockerfile.rag ingests rag/corpus/ at build time), so fass-rag
# needs NO volume. The fass-side RAG client is fail-open: a dead fass-rag
# degrades generation to evidence-less, never blocks it (PRD 4.4).
# Operational rule (PRD 6.7): i7's LIVE compose carries local opt-ins
# (host socket mount, FASS_DOCKER_MANAGE=1, accelerator pin) — merge the
# fass-rag block by hand there, never overwrite the file from the repo.

# fass-http (M13.6): the Apache sidecar serving the http-destined
# streams. The WHOLE output volume is mounted read-only at its htdocs
# root, so a run that writes {output}/http/<run-id>/stream.m3u8 is
# served at /http/<run-id>/stream.m3u8 — GET /v1/streams lists those
# URLs. The per-run subdirs are the DASH/HLS segment-name collision fix
# (the muxer names segments independent of the playlist file). The
# Config tab's Apply recreates fass ONLY — fass-http is owned by the
# host-side `compose up` (docker/launcher.sh start|rebuild).

services:
  fass:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fass:latest
    container_name: fass
    ports:
      - "8000:8000"
      # --- stream ports: "host:container/proto", one per Config-tab mapping.
      # Receive (camera in):  the camera pushes to <this host's IP>:5000
      #   and the command uses udp://host:5000
      # Send (pull out):      the command uses srt://host:9000/stream
      # - "5000:5000/udp"
      # - "9000:9000/tcp"
    volumes:
      # Host folders come from docker/.env (written by docker/install.sh,
      # re-synced from config.json by launcher.sh — the Config tab owns
      # them after install). Defaults are repo-relative, resolved against
      # this file's directory.
      - ${FASS_INPUT_DIR:-../media/input}:/input
      - ${FASS_OUTPUT_DIR:-../media/output}:/output
      - ${FASS_LOG_DIR:-../media/log}:/log
      - ${FASS_CONFIG_DIR:-../docker-data/config}:/config
      # Config-tab Apply button (container self-management):
      # - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Remote volume mappings (Config -> Volumes -> *_remote) reaching
      # on-host stores (MinIO/FTP/SFTP) use host.docker.internal; the
      # docker bridge's 172.17.0.1 is not the right gateway on every
      # host, so the name is the portable spelling. The Config-tab Apply
      # (dockerctl.recreate) carries it through too.
      - host.docker.internal:host-gateway
    environment:
      - FASS_ALLOW_EXECUTE=1
      - FASS_CONFIG=/config/config.json
      - FASS_RUN_DIR=/log/runs
      - FASS_CONTAINER_NAME=fass
      - FASS_DOCKER_WORKER=fass-worker:8001
      # - FASS_DOCKER_MANAGE=1
      # RAG active by default (M13): the fass-rag service below answers on
      # the compose network; the client is fail-open if it is down.
      - FASS_RAG_ENABLED=1
      - FASS_RAG_URL=http://fass-rag:8100
      # GPU answer from install.sh (docker/.env): 0 = no GPU on this
      # machine — GPU-involved commands generate but execution is
      # refused (fass/gpu.py); 1 = probe nvidia-smi in the container
      - FASS_GPU_PROBE=${FASS_GPU:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              # Pin to GPU 1 (RTX 4060 Ti): GPU 0 (RTX 4080 Super) runs the
              # strata LLM and must stay untouched. Keep in sync with the
              # Config tab's gpu.device (Apply re-creates from that value).
              device_ids: ["1"]
    restart: unless-stopped

  fass-worker:
    # The Apply sidecar: owns the container swap (a container cannot
    # recreate itself — see docker/README.md). Same image, no GPU.
    image: fass:latest
    container_name: fass-worker
    command: ["worker", "--port", "8001"]
    volumes:
      - ${FASS_CONFIG_DIR:-../docker-data/config}:/config
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FASS_CONTAINER_NAME=fass
      - FASS_DOCKER_MANAGE=1
      - FASS_CONFIG=/config/config.json
    restart: unless-stopped

  fass-rag:
    # Lexical RAG retriever (joint PRD 5.6 + 6.7), default service (M13).
    # CPU-only, non-root, no device passthrough, no host socket. The pinned
    # corpus index is baked into the image at build time (Dockerfile.rag
    # ingests rag/corpus/ into /data), so NO volume is mounted: the service
    # starts serving with its DB already present. Not port-published —
    # only the fass service talks to it, via compose DNS.
    build: { context: .., dockerfile: docker/Dockerfile.rag }
    image: fass-rag:latest
    environment:
      - FASS_RAG_DATA=/data
      - FASS_RAG_BIND=0.0.0.0:8100
    healthcheck: { test: ["CMD", "python", "-m", "rag.health"], interval: 30s }
    restart: unless-stopped

  fass-http:
    # Apache sidecar (M13.6): static server for the http-destined
    # streams (see the file header). Read-only mount of the WHOLE
    # output dir at the htdocs root, so /http/<run-id>/x.m3u8 URLs map
    # 1:1 onto the files. Host port: the install.sh prompt
    # (FASS_HTTP_PORT in docker/.env), default 8080 — fass owns 8000,
    # fass-rag stays internal (8100, not published).
    image: httpd:2.4-alpine
    container_name: fass-http
    # The stock httpd.conf includes NO conf/extra glob (its httpd-*.conf
    # Includes are all commented out), so the header conf below is pulled in
    # explicitly via httpd's -c directive (httpd-foreground = httpd -DFOREGROUND).
    command: ["httpd-foreground", "-c", "Include conf/extra/httpd-fass.conf"]
    ports:
      - "${FASS_HTTP_PORT:-8080}:80"
    volumes:
      - ${FASS_OUTPUT_DIR:-../media/output}:/usr/local/apache2/htdocs:ro
      # Player-tab headers (CORS on stream files, no-cache on playlists):
      - ${FASS_HTTP_CORS_CONF:-../docker/fass-http/httpd-fass.conf}:/usr/local/apache2/conf/extra/httpd-fass.conf:ro
    restart: unless-stopped
