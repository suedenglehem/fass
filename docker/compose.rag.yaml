# fass-rag overlay (M11.2, joint PRD 6.7). Opt-in via the "rag" profile, so
# the default deployment is unchanged. From the repo root:
#
#   docker compose -f docker/compose.yaml -f docker/compose.rag.yaml config
#   docker compose -f docker/compose.yaml -f docker/compose.rag.yaml --profile rag up -d --build
#
# docker/compose.yaml itself is NOT modified. Operational rule (PRD 6.7):
# never copy this file over i7's compose — i7 carries local opt-ins (host
# socket mount, FASS_DOCKER_MANAGE=1, accelerator pin); merge the fass-rag
# block manually there. This service takes no device passthrough, mounts no
# host socket, and runs as a non-root user with no elevated privileges.

services:
    fass-rag:
      build: { context: .., dockerfile: docker/Dockerfile.rag }
      image: fass-rag:latest
      profiles: ["rag"]
      volumes:
        - /dd2/andrei/fass/docker-data/rag:/data
      environment:
        - FASS_RAG_DATA=/data
        - FASS_RAG_BIND=0.0.0.0:8100
      healthcheck: { test: ["CMD", "python", "-m", "rag.health"], interval: 30s }
      restart: unless-stopped
